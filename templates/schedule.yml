# Copy to .github/workflows/schedule.yml in your blog repository.
# Publishes the posts marked `status: scheduled` once their `publish_at` has passed (read in blog.json's "timezone", UTC with none),
# then regenerates the site and commits once. Not before publish_at, and normally within the hour: GitHub's `schedule` is
# best-effort, so the time is not exact. With nothing due it commits nothing; if a due post cannot be published (an extension output
# was never recorded, a reference does not resolve) it stays scheduled and this workflow fails, which is how you find out.
# GitHub switches scheduled workflows off after 60 days without repository activity in a public repository: a post scheduled
# further out than that needs a commit (or this workflow re-enabled) before its day. A scheduled post's source is public in a public
# repository: `scheduled` keeps it off the site, not out of GitHub.
name: publish scheduled posts

on:
  schedule:
    - cron: "23 * * * *" # not :00, when GitHub is busiest
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tejaswigowda/blog-webCLI
          ref: main # pin to a commit sha, as in blog-check.yml
          path: .blog-webcli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .blog-webcli/cli/blog.js publish-due .
      - name: commit what changed
        run: |
          git add -A -- . ':!.blog-webcli'
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish scheduled posts"
          git push
